<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFF 2026 Data Exporter & Backup Vault</title>
  <link rel="stylesheet" href="styles.css?v=15">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .export-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .export-card h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .export-card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .stat-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-num {
      font-size: 1.6rem;
      font-weight: 800;
      color: #10b981;
    }
    .stat-lbl {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-exp {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-exp:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .btn-green {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    }
    .btn-json {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
    }
  </style>
</head>
<body>

  <div class="export-card">
    <i class="fa-solid fa-file-export" style="font-size: 2.5rem; color: #38bdf8; margin-bottom: 12px;"></i>
    <h2>GFF 2026 Master Data Exporter</h2>
    <p>Export all contacts, leads, meeting notes, and personal thoughts saved across all profiles during Global Fintech Fest 2026.</p>

    <div class="stat-badge">
      <div class="stat-item">
        <span class="stat-num" id="statLeads">0</span>
        <span class="stat-lbl">Lead Contacts</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="statThoughts" style="color: #f59e0b;">0</span>
        <span class="stat-lbl">Quick Thoughts</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-exp btn-green" onclick="exportMasterLeadsCSV()">
        <i class="fa-solid fa-file-csv"></i> Export All Lead Contacts (Excel CSV)
      </button>

      <button class="btn-exp" onclick="exportMasterThoughtsCSV()">
        <i class="fa-solid fa-file-csv"></i> Export All Quick Thoughts (Excel CSV)
      </button>

      <button class="btn-exp btn-json" onclick="exportFullJSONBackup()">
        <i class="fa-solid fa-database"></i> Download Complete JSON Backup
      </button>

      <a href="index.html" class="btn-exp" style="background: transparent; border: 1px solid #475569; margin-top: 8px;">
        <i class="fa-solid fa-arrow-left"></i> Back to Pass App
      </a>
    </div>
  </div>

  <script>
    const PROFILES = ["abhigya", "rishi", "mahavir", "kamal"];

    function getAllLeads() {
      let allLeads = [];
      PROFILES.forEach(prof => {
        const key = `gff_notes_v2_${prof}`;
        const stored = localStorage.getItem(key);
        if (stored) {
          try {
            const list = JSON.parse(stored);
            list.forEach(item => {
              allLeads.push({ owner: prof.toUpperCase(), ...item });
            });
          } catch(e) {}
        }
      });
      return allLeads;
    }

    function getAllThoughts() {
      let allThoughts = [];
      PROFILES.forEach(prof => {
        const key = `gff_thoughts_v1_${prof}`;
        const stored = localStorage.getItem(key);
        if (stored) {
          try {
            const list = JSON.parse(stored);
            list.forEach(item => {
              allThoughts.push({ owner: prof.toUpperCase(), ...item });
            });
          } catch(e) {}
        }
      });
      return allThoughts;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const leads = getAllLeads();
      const thoughts = getAllThoughts();
      document.getElementById("statLeads").textContent = leads.length;
      document.getElementById("statThoughts").textContent = thoughts.length;
    });

    function exportMasterLeadsCSV() {
      const leads = getAllLeads();
      if (leads.length === 0) {
        alert("No leads found in local storage!");
        return;
      }
      const headers = ["Profile Owner", "Contact Name", "Company", "Phone / Email", "Discussion Topic", "Notes / Action Items", "Date"];
      const rows = leads.map(l => [
        `"${(l.owner || '').replace(/"/g, '""')}"`,
        `"${(l.name || '').replace(/"/g, '""')}"`,
        `"${(l.company || '').replace(/"/g, '""')}"`,
        `"${(l.contact || '').replace(/"/g, '""')}"`,
        `"${(l.tag || '').replace(/"/g, '""')}"`,
        `"${(l.notes || '').replace(/"/g, '""')}"`,
        `"${(l.date || '').replace(/"/g, '""')}"`
      ]);

      downloadBlob([headers.join(','), ...rows.map(r => r.join(','))].join('\n'), "GFF2026_MASTER_ALL_LEADS.csv", "text/csv;charset=utf-8;");
    }

    function exportMasterThoughtsCSV() {
      const thoughts = getAllThoughts();
      if (thoughts.length === 0) {
        alert("No thoughts found in local storage!");
        return;
      }
      const headers = ["Profile Owner", "Topic / Title", "Description / Key Points", "Date"];
      const rows = thoughts.map(t => [
        `"${(t.owner || '').replace(/"/g, '""')}"`,
        `"${(t.title || '').replace(/"/g, '""')}"`,
        `"${(t.desc || '').replace(/"/g, '""')}"`,
        `"${(t.date || '').replace(/"/g, '""')}"`
      ]);

      downloadBlob([headers.join(','), ...rows.map(r => r.join(','))].join('\n'), "GFF2026_MASTER_ALL_THOUGHTS.csv", "text/csv;charset=utf-8;");
    }

    function exportFullJSONBackup() {
      const backupData = {
        exportedAt: new Date().toISOString(),
        leads: getAllLeads(),
        thoughts: getAllThoughts()
      };
      downloadBlob(JSON.stringify(backupData, null, 2), "GFF2026_FULL_BACKUP.json", "application/json;charset=utf-8;");
    }

    function downloadBlob(content, filename, contentType) {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  </script>
</body>
</html>
